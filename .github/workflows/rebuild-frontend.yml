# .github/workflows/rebuild-frontend.yml
#
# Rebuilds the frontend image for a specific environment using the
# .env.frontend currently stored on S3, without requiring a new git tag.
#
# Use this when .env.frontend changes on S3 and the bundle needs to be
# rebuilt to bake in the updated NEXT_PUBLIC_* variables.
#
# One image per tenant that runs in the environment (running EC2 instances
# tagged Environment + Tenant, limited to DEPLOY_TENANTS — as in deploy.yml),
# tagged TAG-ENVIRONMENT-TENANT exactly like deploy.yml, because
# docker-compose-prod.yml pulls frontend:${TAG_NAME}-${ENVIRONMENT}-${TENANT_NAME}.
#
# Discovery istanze via tag EC2 (come deploy.yml):
#   Filtra per tag Tenant (da DEPLOY_TENANTS) + Environment + running.
#   Nessun SSH - tutto via SSM.
#
# Su ogni istanza, come deploy.yml: sync di rays-infra, aggiornamento di
# fetch-secrets.sh da S3, refetch di secrets ed env file (placeholder dei
# secret opzionali inclusi), poi make pull-frontend.
#
# Inputs:
#   environment  - which environment to rebuild (integration/staging/production)
#   tag          - which version tag to use (e.g. v2.7.6-release)
#                  leave blank to auto-detect from ECR the latest tag with a
#                  frontend image for this environment and one of the tenants
#                  The same tag is written as TAG_NAME on the instances, which
#                  also selects the backend image: use the deployed version.

name: Rebuild Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to rebuild (integration / staging / production)"
        required: true
        type: choice
        options:
          - integration
          - staging
          - production
      tag:
        description: "Tag to use (e.g. v2.7.6-release) -- leave blank to auto-detect latest"
        required: false
        type: string

env:
  AWS_REGION: eu-west-1
  ECR_FRONTEND_REPO: rays-nexi/frontend
  DOCKER_BASE_DIR: /data/docker

jobs:

  # ============================================================
  # JOB 1: Rebuild the frontend images (one per tenant) for the selected environment
  # ============================================================
  rebuild:
    name: Rebuild frontend (${{ github.event.inputs.environment }})
    runs-on: [self-hosted, rays-ci]

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          AWS_REGION_VAL: ${{ env.AWS_REGION }}
          ECR_FRONTEND_REPO_VAL: ${{ env.ECR_FRONTEND_REPO }}
          DEPLOY_TENANTS: ${{ secrets.DEPLOY_TENANTS }}
        run: |
          [ -n "$DEPLOY_TENANTS" ] || { echo "ERROR: DEPLOY_TENANTS secret is empty or not set"; exit 1; }

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            echo "Using provided tag: $TAG"
          else
            echo "Auto-detecting latest tag for environment: $INPUT_ENV (tenants: $DEPLOY_TENANTS)"
            # Every tag of every image, oldest push first: an image built with
            # identical content for two tenants carries both tenant tags.
            aws ecr describe-images \
              --region "$AWS_REGION_VAL" \
              --repository-name "$ECR_FRONTEND_REPO_VAL" \
              --query "sort_by(imageDetails[?imageTags!=\`null\`], &imagePushedAt)[*].imageTags" \
              --output json > /tmp/ecr_tags.json

            echo "" | base64 -d > /tmp/resolve_tag.py
            TAG=$(INPUT_ENV="$INPUT_ENV" DEPLOY_TENANTS="$DEPLOY_TENANTS" python3 /tmp/resolve_tag.py)
            [ -n "$TAG" ] || { echo "ERROR: could not auto-detect tag for environment $INPUT_ENV"; exit 1; }
            echo "Auto-detected tag: $TAG"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout rays-infra
        uses: actions/checkout@v4
        with:
          repository: humanbit-dev-org/rays-infra
          ref: main
          token: ${{ secrets.RAYS_ACCESS_TOKEN }}
          path: infra
          clean: true

      - name: Checkout rays at resolved tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          path: infra/codebase

      - name: Download Font Awesome from S3
        run: |
          mkdir -p infra/codebase/frontend/public/fonts
          aws s3 cp \
            s3://s3-rays-config/assets/fontawesome-pro-6.5.1-web.zip \
            infra/codebase/frontend/public/fonts/fontawesome-pro-6.5.1-web.zip \
            --region ${{ env.AWS_REGION }}
          unzip -oq infra/codebase/frontend/public/fonts/fontawesome-pro-6.5.1-web.zip \
            -d infra/codebase/frontend/public/fonts/
          rm -f infra/codebase/frontend/public/fonts/fontawesome-pro-6.5.1-web.zip

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # One image per tenant that runs in this environment, same naming as
      # deploy.yml and docker-compose-prod.yml: TAG-ENVIRONMENT-TENANT.
      # Tenants: running EC2 instances tagged Environment + Tenant, limited to
      # DEPLOY_TENANTS (the deploy job's discovery). A tenant that runs here
      # but has no .env.frontend on S3 is an error: its instances would pull
      # a missing image.
      - name: Rebuild and push frontend images
        working-directory: infra
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_FRONTEND_REPO_VAL: ${{ env.ECR_FRONTEND_REPO }}
          DEPLOY_TENANTS: ${{ secrets.DEPLOY_TENANTS }}
          AWS_REGION_VAL: ${{ env.AWS_REGION }}
        run: |
          TENANT_FILTER="$(echo "$DEPLOY_TENANTS" | tr -d '[:space:]')"
          [ -n "$TENANT_FILTER" ] || { echo "ERROR: DEPLOY_TENANTS secret is empty or not set"; exit 1; }
          ENV_TENANTS=$(aws ec2 describe-instances --region "$AWS_REGION_VAL" \
            --filters "Name=tag:Environment,Values=${INPUT_ENV}" "Name=tag:Tenant,Values=${TENANT_FILTER}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].[Tags[?Key=='Tenant'] | [0].Value]" \
            --output text | sort -u)
          [ -n "$ENV_TENANTS" ] || { echo "ERROR: no running ${INPUT_ENV} instances for tenants ${TENANT_FILTER} — nothing to rebuild"; exit 1; }
          echo "Rebuilding frontend for tenants with running ${INPUT_ENV} instances: $(echo $ENV_TENANTS) (tag: $TAG)"

          BUILT=0
          for TENANT in $ENV_TENANTS; do
            echo "--- Rebuilding frontend for tenant=$TENANT environment=$INPUT_ENV ---"

            if ! aws s3 cp \
                "s3://s3-rays-config/${TENANT}/${INPUT_ENV}/.env.frontend" \
                .env.frontend --region "$AWS_REGION_VAL" 2>/dev/null; then
              echo "ERROR: ${TENANT} runs in ${INPUT_ENV} but s3://s3-rays-config/${TENANT}/${INPUT_ENV}/.env.frontend is missing"
              exit 1
            fi

            IMAGE="${ECR_REGISTRY}/${ECR_FRONTEND_REPO_VAL}:${TAG}-${INPUT_ENV}-${TENANT}"
            CACHE_IMAGE="${ECR_REGISTRY}/${ECR_FRONTEND_REPO_VAL}:cache-${INPUT_ENV}-${TENANT}"

            get_arg() { grep "^$1=" .env.frontend 2>/dev/null | cut -d= -f2- | tr -d '"' || true; }
            NEXT_PUBLIC_TENANT_ID="$(get_arg NEXT_PUBLIC_TENANT_ID)"

            docker buildx build \
              --target front-prod \
              --build-arg PHP_APACHE_IMAGE="php:8.4-apache" \
              --build-arg APP_NAME="RAYS Nexi" \
              --build-arg CODEBASE="/var/www/html/codebase" \
              --build-arg CODEUSER="codeuser" \
              --build-arg HOST_UID="1002" \
              --build-arg HOST_GID="1002" \
              $([ -n "$NEXT_PUBLIC_TENANT_ID" ] && echo "--build-arg NEXT_PUBLIC_TENANT_ID=$NEXT_PUBLIC_TENANT_ID") \
              --cache-from type=registry,ref="${CACHE_IMAGE}" \
              --cache-to type=registry,ref="${CACHE_IMAGE}",mode=max \
              --tag "$IMAGE" \
              --push \
              .

            echo "OK: pushed ${IMAGE}"
            BUILT=$((BUILT+1))
          done

          echo "OK: ${BUILT} frontend image(s) rebuilt for ${INPUT_ENV}"

  # ============================================================
  # JOB 2: Deploy the rebuilt image to the target environment
  # Discovery via tag EC2 Environment + Tenant (come deploy.yml)
  # ============================================================
  deploy:
    name: Deploy frontend (${{ github.event.inputs.environment }})
    needs: rebuild
    runs-on: [self-hosted, rays-ci]
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Deploy via SSM
        env:
          TAG: ${{ needs.rebuild.outputs.tag }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          AWS_REGION_VAL: ${{ env.AWS_REGION }}
          DOCKER_BASE_DIR: ${{ env.DOCKER_BASE_DIR }}
          RAYS_ACCESS_TOKEN: ${{ secrets.RAYS_ACCESS_TOKEN }}
          DEPLOY_TENANTS: ${{ secrets.DEPLOY_TENANTS }}
          ASG_NAME: ${{ secrets.PROD_ASG_NAME }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
        run: |
          REGION="${AWS_REGION_VAL}"

          TENANT_VALUES="Values=${DEPLOY_TENANTS}"
          echo "Deploying to tenants: $DEPLOY_TENANTS (environment: $INPUT_ENV)"

          if [ "$INPUT_ENV" = "production" ]; then
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --region "$REGION" \
              --filters \
                "Name=tag:aws:autoscaling:groupName,Values=${ASG_NAME}" \
                "Name=tag:Environment,Values=production" \
                "Name=tag:Tenant,${TENANT_VALUES}" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text)
          else
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --region "$REGION" \
              --filters \
                "Name=tag:Environment,Values=${INPUT_ENV}" \
                "Name=tag:Tenant,${TENANT_VALUES}" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text)
          fi

          if [ -z "$INSTANCE_IDS" ]; then
            echo "WARN: no running ${INPUT_ENV} instances found for tenants: $DEPLOY_TENANTS -- skipping"
            exit 0
          fi

          INSTANCE_COUNT=$(echo "$INSTANCE_IDS" | wc -w | tr -d ' ')
          echo "Instances found: $INSTANCE_COUNT -- $INSTANCE_IDS"

          echo "" | base64 -d > /tmp/ssm_frontend.py

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "--- Deploying to $INSTANCE_ID ---"

            SSM_PARAMS=$(mktemp)
            REGION_ENV="$REGION" \
            TAG_ENV="$TAG" \
            ECR_ENV="$ECR_REGISTRY" \
            BASE_DIR_ENV="$DOCKER_BASE_DIR" \
            TOKEN_ENV="$RAYS_ACCESS_TOKEN" \
            python3 /tmp/ssm_frontend.py > "$SSM_PARAMS"

            COMMAND_ID=$(aws ssm send-command \
              --region "$REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "file://$SSM_PARAMS" \
              --query "Command.CommandId" \
              --output text)

            rm -f "$SSM_PARAMS"

            echo "SSM Command ID: $COMMAND_ID -- waiting for completion..."

            SSM_TIMEOUT=600
            SSM_ELAPSED=0
            STATUS=""
            RESULT=""

            while [ "$SSM_ELAPSED" -le "$SSM_TIMEOUT" ]; do
              RESULT=$(aws ssm get-command-invocation \
                --region "$REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json)

              STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['Status'])")

              case "$STATUS" in
                Success|Failed|Cancelled|TimedOut) break ;;
                *) echo "SSM status on $INSTANCE_ID: $STATUS (${SSM_ELAPSED}s)"; sleep 15; SSM_ELAPSED=$((SSM_ELAPSED+15)) ;;
              esac
            done

            echo "$RESULT"

            if [ "$STATUS" != "Success" ]; then
              echo "ERROR: SSM command failed on $INSTANCE_ID (Status: $STATUS) -- rolling stopped"
              exit 1
            fi
            echo "OK: frontend redeployed on $INSTANCE_ID"
          done

          echo "OK: frontend rebuild deploy completed ($INSTANCE_COUNT instances)"