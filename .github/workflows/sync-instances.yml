# .github/workflows/sync-instances.yml
#
# Allinea le istanze di TUTTI gli environment e di tutti i tenant a infra e
# secrets correnti, SENZA build di immagini. Sostituisce Sync Infra e
# Refetch Secrets, che separati lasciavano le istanze incoerenti (compose
# nuovo con secrets vecchi, o viceversa).
#
# Su ogni istanza, in ordine:
#   1. sync di rays-infra su main
#   2. aggiornamento di fetch-secrets.sh da s3://s3-rays-config/scripts/ SOLO
#      se è cambiato (validato con bash -n, sostituzione atomica, versione
#      precedente in fetch-secrets.sh.prev)
#   3. refetch di secrets ed env file (TAG_NAME, che il fetch toglie dal .env,
#      viene ripristinato)
#   4. make secrets-check e, con recreate=true, make pull: i container vengono
#      ricreati con lo stesso TAG_NAME per usare i nuovi valori, seguito dallo
#      stesso health check del deploy
#
# Quando usarlo: secret corretto o ruotato in Secrets Manager, env file
# cambiato su S3, fix infra (Makefile, compose) da portare subito ovunque.
# Per una variabile NEXT_PUBLIC_* serve invece Rebuild Frontend (è nel bundle).
#
# Perché sempre tutti gli environment e tutti i tenant: i compose sono
# condivisi tra environment e tenant, quindi infra e secrets devono restare
# allineati ovunque.
#
# Discovery: per ogni environment (job della matrice) le istanze running con
# tag Tenant in DEPLOY_TENANTS (secret di quell'environment) + tag
# Environment; in production anche il tag dell'ASG (PROD_ASG_NAME).
# Gli environment girano in parallelo e indipendenti; dentro un environment
# il rolling è un'istanza alla volta e si ferma al primo errore.

name: Sync Instances

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: "Recreate containers (same TAG_NAME) so they pick up the new secrets and env files"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-instances
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  DOCKER_BASE_DIR: /data/docker

jobs:

  sync:
    name: Sync instances (${{ matrix.environment }})
    runs-on: [self-hosted, rays-ci]
    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix:
        environment: [integration, staging, production]

    steps:
      - name: Sync via SSM (rolling)
        env:
          TARGET_ENV: ${{ matrix.environment }}
          RECREATE: ${{ inputs.recreate && 'true' || 'false' }}
          AWS_REGION_VAL: ${{ env.AWS_REGION }}
          DOCKER_BASE_DIR: ${{ env.DOCKER_BASE_DIR }}
          RAYS_ACCESS_TOKEN: ${{ secrets.RAYS_ACCESS_TOKEN }}
          DEPLOY_TENANTS: ${{ secrets.DEPLOY_TENANTS }}
          ASG_NAME: ${{ secrets.PROD_ASG_NAME }}
          PROD_TARGET_GROUP_ARN: ${{ secrets.PROD_TARGET_GROUP_ARN }}
        run: |
          REGION="$AWS_REGION_VAL"

          [ -n "$DEPLOY_TENANTS" ] || { echo "ERROR: DEPLOY_TENANTS secret is empty or not set"; exit 1; }
          TENANT_VALUES="Values=${DEPLOY_TENANTS}"

          FILTERS=(
            "Name=tag:Environment,Values=${TARGET_ENV}"
            "Name=tag:Tenant,${TENANT_VALUES}"
            "Name=instance-state-name,Values=running"
          )
          if [ "$TARGET_ENV" = "production" ]; then
            [ -n "${ASG_NAME:-}" ] || { echo "ERROR: PROD_ASG_NAME secret is empty or not set"; exit 1; }
            FILTERS+=("Name=tag:aws:autoscaling:groupName,Values=${ASG_NAME}")
          fi

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region "$REGION" \
            --filters "${FILTERS[@]}" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "WARN: no running ${TARGET_ENV} instances found for tenants: $DEPLOY_TENANTS — skipping"
            exit 0
          fi

          INSTANCE_COUNT=$(echo "$INSTANCE_IDS" | wc -w | tr -d ' ')
          echo "Sync on ${TARGET_ENV} (recreate: $RECREATE) — instances found: $INSTANCE_COUNT — $INSTANCE_IDS"

          if [ "$RECREATE" = "true" ]; then SSM_TIMEOUT=1800; else SSM_TIMEOUT=300; fi

          echo "" | base64 -d > /tmp/ssm_sync_instances.py

          DONE=0
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "--- Syncing $INSTANCE_ID ($((DONE+1))/$INSTANCE_COUNT) ---"

            SSM_PARAMS=$(mktemp)
            REGION_ENV="$REGION" \
            BASE_DIR_ENV="$DOCKER_BASE_DIR" \
            TOKEN_ENV="$RAYS_ACCESS_TOKEN" \
            RECREATE_ENV="$RECREATE" \
            python3 /tmp/ssm_sync_instances.py > "$SSM_PARAMS"

            COMMAND_ID=$(aws ssm send-command \
              --region "$REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "file://$SSM_PARAMS" \
              --query "Command.CommandId" \
              --output text)

            rm -f "$SSM_PARAMS"
            echo "SSM Command ID: $COMMAND_ID — waiting for completion..."

            SSM_ELAPSED=0
            STATUS=""
            RESULT=""

            while [ "$SSM_ELAPSED" -le "$SSM_TIMEOUT" ]; do
              RESULT=$(aws ssm get-command-invocation \
                --region "$REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json)

              STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['Status'])")

              case "$STATUS" in
                Success|Failed|Cancelled|TimedOut) break ;;
                *) echo "SSM status on $INSTANCE_ID: $STATUS (${SSM_ELAPSED}s)"; sleep 10; SSM_ELAPSED=$((SSM_ELAPSED+10)) ;;
              esac
            done

            echo "$RESULT"

            if [ "$STATUS" != "Success" ]; then
              echo "ERROR: sync failed on $INSTANCE_ID (Status: $STATUS) — rolling stopped, $((INSTANCE_COUNT-DONE-1)) remaining instance(s) untouched"
              exit 1
            fi

            if [ "$RECREATE" = "true" ]; then
              # Health check after (re)creating the containers on $INSTANCE_ID:
              # integration/staging via the backend /health endpoint, production via the
              # ALB target groups of the ASG.
              if [ "$TARGET_ENV" = "production" ]; then
                if [ -n "${PROD_TARGET_GROUP_ARN:-}" ]; then
                  TARGET_GROUP_ARNS="$PROD_TARGET_GROUP_ARN"
                else
                  TARGET_GROUP_ARNS=$(aws autoscaling describe-auto-scaling-groups \
                    --region "$REGION" \
                    --auto-scaling-group-names "$ASG_NAME" \
                    --query "AutoScalingGroups[0].TargetGroupARNs[]" \
                    --output text)
                fi

                [ -n "$TARGET_GROUP_ARNS" ] && [ "$TARGET_GROUP_ARNS" != "None" ] \
                  || { echo "ERROR: no target group found for ASG ${ASG_NAME}"; exit 1; }

                TG_TIMEOUT=120
                TG_ELAPSED=0
                TG_OK=false

                while [ "$TG_ELAPSED" -le "$TG_TIMEOUT" ]; do
                  ALL_HEALTHY=true
                  for TG_ARN in $TARGET_GROUP_ARNS; do
                    STATE=$(aws elbv2 describe-target-health \
                      --region "$REGION" \
                      --target-group-arn "$TG_ARN" \
                      --targets "Id=$INSTANCE_ID" \
                      --query "TargetHealthDescriptions[0].TargetHealth.State" \
                      --output text 2>/dev/null || true)
                    echo "ALB health on $INSTANCE_ID: $STATE (${TG_ELAPSED}s)"
                    [ "$STATE" = "healthy" ] || ALL_HEALTHY=false
                  done
                  $ALL_HEALTHY && TG_OK=true && break
                  sleep 10
                  TG_ELAPSED=$((TG_ELAPSED+10))
                done

                if [ "$TG_OK" != "true" ]; then
                  echo "ERROR: ALB health check timed out for $INSTANCE_ID — rolling stopped"
                  exit 1
                fi
                echo "OK: ALB health check passed for $INSTANCE_ID"
              else
                HEALTH_TIMEOUT=120
                HEALTH_ELAPSED=0
                HTTP_CODE="000"

                while [ "$HEALTH_ELAPSED" -le "$HEALTH_TIMEOUT" ]; do
                  HTTP_CMD_ID=$(aws ssm send-command \
                    --region "$REGION" \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters 'commands=["curl --max-time 5 -s -o /dev/null -w \"%{http_code}\" http://localhost:8080/health || true"]' \
                    --query "Command.CommandId" \
                    --output text)

                  sleep 5

                  HTTP_CODE=$(aws ssm get-command-invocation \
                    --region "$REGION" \
                    --command-id "$HTTP_CMD_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "StandardOutputContent" \
                    --output text | tr -d '[:space:]')

                  echo "Health check on $INSTANCE_ID: HTTP ${HTTP_CODE:-000} (${HEALTH_ELAPSED}s)"

                  if [ "$HTTP_CODE" = "200" ]; then
                    break
                  fi

                  sleep 10
                  HEALTH_ELAPSED=$((HEALTH_ELAPSED + 15))
                done

                if [ "$HTTP_CODE" != "200" ]; then
                  echo "ERROR: health check timed out on $INSTANCE_ID after ${HEALTH_TIMEOUT}s (HTTP ${HTTP_CODE:-000}) — rolling stopped"
                  exit 1
                fi
                echo "OK: health check passed on $INSTANCE_ID (HTTP $HTTP_CODE)"
              fi
            fi

            DONE=$((DONE+1))
            echo "OK: $INSTANCE_ID synced"
          done

          echo "OK: ${TARGET_ENV} sync completed ($INSTANCE_COUNT instances, recreate: $RECREATE)"
